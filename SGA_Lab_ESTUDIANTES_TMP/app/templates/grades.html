{% extends 'base.html' %}{% block content %}<h1>Calificaciones</h1><table><tr><th>Estudiante</th><th>Curso</th><th>N1</th><th>N2</th><th>N3</th><th>Definitiva</th><th></th></tr>{% for r in rows %}<tr><form method="post" action="/grades/save/{{r['id']}}"><td>{{r['student']}}</td><td>{{r['code']}}</td>{% for n in [1,2,3] %}<td><input name="grade{{n}}" value="{{r['grade'+n|string] or ''}}" type="number" step="0.1"></td>{% endfor %}<td>{{r['final_grade'] or '-'}}</td><td><button>Guardar</button></td></form></tr>{% endfor %}</table>{% endblock %}
